# Only HTTP basic auth failures in an Apache error log (wrong password, unknown user).
# Narrower than the stock apache-auth filter, which also counts "client denied" and similar.
[Definition]
failregex = ^\[[^]]*\] \[auth_basic:error\] \[pid \d+(:tid \d+)?\] (\(\d+\)[^:]*: )?\[client <HOST>(:\d+)?\] AH01617: user .*?: authentication failure for "[^"]*": Password Mismatch
            ^\[[^]]*\] \[auth_basic:error\] \[pid \d+(:tid \d+)?\] (\(\d+\)[^:]*: )?\[client <HOST>(:\d+)?\] AH01618: user .*? not found: \S*
ignoreregex =
