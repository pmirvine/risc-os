# Included (via /etc/apache2/conf.d/ro.inc) inside the <VirtualHost *:443> of tsihome.mynetgear.com.
# Public URL: https://tsihome.mynetgear.com/ro/  ->  http://127.0.0.1:18371/  (the /ro prefix is stripped).
# The file in the repository keeps the placeholder __SECRET__; install-apache.sh substitutes the real one.

# MIME types missing on this server (ES modules, web fonts, WebAssembly).
AddType font/woff2 .woff2
AddType text/javascript .mjs
AddType application/wasm .wasm

# /ro -> /ro/ so relative URLs resolve.
Redirect permanent "/ro" "/ro/"

<Location "/ro/">
    # Basic auth: the only login. The bcrypt file is made with htpasswd -B (see README).
    AuthType Basic
    AuthName "RISC OS"
    AuthBasicProvider file
    AuthUserFile /etc/apache2/ro.htpasswd
    Require valid-user

    # Do not let compression buffer the HostFS event stream or the WebSocket.
    SetEnv no-gzip 1

    # Tell the app it is behind a trusted proxy: the secret proves the request came through Apache.
    # 'set' replaces anything the client sent with the same name.
    RequestHeader set X-Proxy-Auth "__SECRET__"
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPreserveHost On

    # WebSocket (portable form, works on any 2.4): upgrade requests go to ws://, everything else to http://.
    # Alternative on httpd >= 2.4.47: add "upgrade=websocket" to the ProxyPass line below and drop these three lines.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/ro/(.*)$ ws://127.0.0.1:18371/$1 [P,L]

    # Plain HTTP. timeout: seconds of idle allowed on the backend connection (long-lived WebSocket and
    # server-sent events for HostFS). flushpackets=on: pass each chunk on at once (SSE).
    ProxyPass "http://127.0.0.1:18371/" timeout=3600 flushpackets=on
    ProxyPassReverse "http://127.0.0.1:18371/"
</Location>

# Keep the proxy connection and the client connection from timing out under a quiet WebSocket.
ProxyTimeout 3600
