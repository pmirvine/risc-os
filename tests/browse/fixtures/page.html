<!doctype html>
<html><head><meta charset="utf-8"><title>Fixture page</title>
<!-- everything at a fixed place, so tests/browse can click on it -->
<style>
body { font: 16px sans-serif; margin: 0; height: 2000px }
#h, #next, #blank, #field, #sel, #ask, #dl, #file, #tone, #res, #box { position: absolute; left: var(--x); top: var(--y); width: var(--w); height: 30px; margin: 0; box-sizing: border-box }
#h { font-size: 20px }
#box { background: #c00; height: 100px }
</style></head>
<body>
<h1 id="h" style="--x:10px;--y:10px;--w:400px">Hello from the fixture</h1>
<a id="next" href="second.html" style="--x:10px;--y:60px;--w:120px">Second page</a>
<a id="blank" href="second.html" target="_blank" style="--x:200px;--y:60px;--w:120px">In a new tab</a>
<input id="field" value="" style="--x:10px;--y:110px;--w:150px">
<select id="sel" style="--x:200px;--y:110px;--w:120px"><option>Red</option><option>Green</option><option disabled>Grey</option><option>Blue</option></select>
<button id="ask" style="--x:10px;--y:160px;--w:80px" onclick="document.getElementById('res').textContent = String(confirm('Sure?'))">Ask</button>
<a id="dl" href="data:text/plain;charset=utf-8,Downloaded%20text" download="notes.txt" style="--x:110px;--y:160px;--w:90px">Download</a>
<input id="file" type="file" style="--x:220px;--y:160px;--w:200px" onchange="this.files[0].text().then((t) => { document.getElementById('res').textContent = this.files[0].name + ':' + t; })">
<button id="tone" style="--x:440px;--y:160px;--w:80px" onclick="const c = new AudioContext(); const o = c.createOscillator(); o.connect(c.destination); o.start(); document.getElementById('res').textContent = 'tone'">Tone</button>
<p id="res" style="--x:10px;--y:210px;--w:400px">-</p>
<div id="box" style="--x:10px;--y:260px;--w:200px"></div>
<p style="position:absolute;top:1900px">The end of a long page</p>
</body></html>
