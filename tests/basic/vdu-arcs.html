<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>VDU Arc Tests</title>
<style>
  body { background: #333; color: #ddd; font: 13px sans-serif; margin: 16px; }
  canvas { display: block; background: #000; margin-bottom: 12px; }
</style>
</head>
<body>
<script type="module">
import { VDU } from '../../src/basic/vdu.js';
const w16 = (v) => [v & 255, (v >> 8) & 255];
const P = (v, k, x, y) => v.write([25, k, ...w16(x), ...w16(y)]);
// Rows: start angle; columns: span. Sector (green) with arc outline (white) on top half of each
// cell, segment (blue) with arc outline below. MODE 28 = square pixels, MODE 12 = tall pixels.
const params = new URLSearchParams(location.search);
const mode = +(params.get('mode') || 28);
const cv = document.createElement('canvas'); document.body.append(cv);
const v = new VDU({ canvas: cv, mode });
const starts = [20, 70, 110, 160, 200, 250, 290, 340];
const spans = [40, 100, 170, 190, 260, 330];
const R = 56;
starts.forEach((a, row) => spans.forEach((span, col) => {
  const cx = 70 + col * 205, cy = 950 - row * 122;
  const pt = (deg, dy) => [cx + Math.round(R * Math.cos(deg * Math.PI / 180)), cy + dy + Math.round(R * Math.sin(deg * Math.PI / 180))];
  const b = a + span;
  for (const [dx, kind, colr] of [[0, 181, mode === 28 ? 0x0C : 2], [120, 173, mode === 28 ? 0x30 : 4]]) {
    const ccx = cx + dx;
    const [sx, sy] = pt(a, 0), [ex, ey] = pt(b, 0);
    v.write([18, 0, colr]);
    P(v, 4, ccx, cy); P(v, 4, sx + dx, sy); P(v, kind, ex + dx, ey);
    v.write([18, 0, mode === 28 ? 0x3F : 7]);
    P(v, 4, ccx, cy); P(v, 4, sx + dx, sy); P(v, 165, ex + dx, ey);
    v.write([18, 0, mode === 28 ? 0x03 : 1]); P(v, 69, sx + dx, sy); // start point in red
  }
}));
v.render();
window.vduDone = true;
</script>
</body>
</html>
