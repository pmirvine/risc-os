<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>VDU Test Pattern</title>
<style>
  body { background: #333; color: #ddd; font: 13px sans-serif; margin: 16px; }
  .grid { display: flex; flex-wrap: wrap; gap: 16px; }
  figure { margin: 0; }
  figcaption { margin-bottom: 4px; }
  canvas { display: block; background: #000; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script type="module">
import { VDU } from '../../src/basic/vdu.js';

const grid = document.getElementById('grid');
function screen(mode, caption) {
  const fig = document.createElement('figure');
  const cap = document.createElement('figcaption'); cap.textContent = caption;
  const cv = document.createElement('canvas');
  fig.append(cap, cv); grid.append(fig);
  return new VDU({ canvas: cv, mode });
}
const w16 = (v) => [v & 255, (v >> 8) & 255];
const P = (v, k, x, y) => v.write([25, k, ...w16(x), ...w16(y)]);
const MOVE = (v, x, y) => P(v, 4, x, y);
const DRAW = (v, x, y) => P(v, 5, x, y);
const GCOL = (v, a, c) => v.write([18, a, c]);
const COLOUR = (v, c) => v.write([17, c]);

// ---- MODE 12: graphics primitives ----
{
  const v = screen(12, 'MODE 12 - PLOT primitives');
  v.write('MODE 12 graphics test pattern\r\n');
  for (let c = 0; c < 16; c++) { GCOL(v, 0, c); MOVE(v, c * 80, 0); P(v, 101, c * 80 + 79, 60); }
  GCOL(v, 0, 1); MOVE(v, 160, 420); P(v, 157, 280, 420);          // circle fill
  GCOL(v, 0, 7); MOVE(v, 160, 420); P(v, 149, 280, 420);          // circle outline
  GCOL(v, 0, 2); MOVE(v, 480, 300); MOVE(v, 700, 300); P(v, 85, 590, 560);   // triangle
  GCOL(v, 0, 3); MOVE(v, 780, 300); MOVE(v, 980, 300); P(v, 117, 1060, 520); // parallelogram
  GCOL(v, 0, 4); MOVE(v, 1150, 420); MOVE(v, 1260, 420); P(v, 205, 1180, 540); // sheared ellipse fill
  GCOL(v, 0, 6); MOVE(v, 160, 800); MOVE(v, 280, 800); P(v, 181, 160, 920); // sector
  GCOL(v, 0, 5); MOVE(v, 480, 800); MOVE(v, 600, 800); P(v, 173, 480, 920); // segment
  GCOL(v, 0, 7); MOVE(v, 800, 800); MOVE(v, 920, 800); P(v, 165, 800, 920);  // arc
  GCOL(v, 0, 3); MOVE(v, 1100, 800); MOVE(v, 1250, 800); P(v, 197, 1100, 900); // ellipse outline
  GCOL(v, 0, 7);
  for (let a = 0; a < 360; a += 15) {                             // star burst of lines
    const r = a * Math.PI / 180; MOVE(v, 640, 180); DRAW(v, 640 + Math.round(150 * Math.cos(r)), 180 + Math.round(90 * Math.sin(r)));
  }
  GCOL(v, 0, 14); MOVE(v, 20, 1000); P(v, 21, 1260, 700);         // dotted line
  GCOL(v, 3, 9); MOVE(v, 0, 650); P(v, 101, 1279, 700);          // EOR bar
  GCOL(v, 16, 0); MOVE(v, 400, 100); P(v, 101, 700, 250);         // ECF 1 pattern
  GCOL(v, 32, 0); MOVE(v, 720, 100); P(v, 101, 1000, 250);        // ECF 2 pattern
  GCOL(v, 0, 10); MOVE(v, 1040, 160); P(v, 133, 0, 0);            // flood fill (to fg green... fills bg)
  v.write([5]); GCOL(v, 0, 11); MOVE(v, 40, 620); v.write('VDU 5 text'); v.write([4]);
  v.write([31, 0, 30]); COLOUR(v, 3); COLOUR(v, 129); v.write(' COLOUR 3 on 1 '); COLOUR(v, 7); COLOUR(v, 128);
  v.render();
}
// ---- MODE 1: 4-colour text & graphics ----
{
  const v = screen(1, 'MODE 1 - 4 colours');
  for (let c = 0; c < 4; c++) { COLOUR(v, c); COLOUR(v, 128 + ((c + 1) & 3)); v.write(` Colour ${c} `); }
  COLOUR(v, 3); COLOUR(v, 128); v.newLine();
  v.write('The quick brown fox jumps over the lazy dog. 0123456789 !"#$%&\'()*+,-./');
  GCOL(v, 0, 2); MOVE(v, 640, 400); P(v, 157, 900, 400);
  GCOL(v, 0, 1); MOVE(v, 100, 100); DRAW(v, 1180, 700);
  GCOL(v, 16, 0); MOVE(v, 100, 600); P(v, 101, 500, 800);
  v.render();
}
// ---- MODE 13: 256 colours ----
{
  const v = screen(13, 'MODE 13 - 256 colours (GCOL + TINT)');
  for (let c = 0; c < 64; c++) for (let t = 0; t < 4; t++) {
    GCOL(v, 0, c); v.write([23, 17, 2, t * 64, 0, 0, 0, 0, 0, 0]);
    const x = (c % 16) * 80, y = 1023 - (Math.floor(c / 16) * 4 + t) * 40 - 200;
    MOVE(v, x, y); P(v, 101, x + 76, y + 36);
  }
  v.write('MODE 13: GCOL c TINT t');
  v.render();
}
// ---- MODE 7: teletext ----
{
  const v = screen(7, 'MODE 7 - teletext');
  const s = (str) => v.write(str);
  s('\x81Red \x82Green \x83Yellow \x84Blue \x85Magenta\x86Cyan\x87White\r\n');
  s('\x8d\x83 Double height  \x81RISC OS\r\n\x8d\x83 Double height  \x81RISC OS\r\n');
  s('\x94\x9d\x87Blue background line          \r\n');
  s('\x91\xff\xff\xff\xff\x92\xf0\xf0\xf0\x93\xb5\xb5\xea\xea \x9a\x96\xff\xff\xff\xff\x99 contig/sep\r\n');
  s('\x88Flashing text\x89 steady text\r\n');
  s('# _ ` { | } ~ [ \\ ] ^\r\n');
  for (let i = 0; i < 5; i++) s(`\x86Line ${i} of ordinary text in mode 7\r\n`);
  v.render();
}
// ---- MODE 0 & MODE 2 ----
{
  const v = screen(2, 'MODE 2 - 16 colours, fat pixels');
  for (let c = 0; c < 16; c++) { COLOUR(v, c); v.write('#'); }
  v.newLine();
  for (let c = 0; c < 8; c++) { GCOL(v, 0, c + 8); MOVE(v, 640, 450); P(v, 149, 640 + 60 * (c + 1), 450); }
  v.render();
}
{
  const v = screen(0, 'MODE 0 - 2 colours, text window + scrolling');
  v.write([28, 10, 20, 50, 10]); v.write([17, 129, 12, 17, 0]);
  for (let i = 0; i < 20; i++) v.write(`Scroll line ${i}\r\n`);
  v.write([26]);
  v.write([31, 0, 0]); v.write('Text window 10,20,50,10 scrolled; circles below');
  for (let r = 40; r < 400; r += 40) { MOVE(v, 640, 150); P(v, 145, r, 0); }
  v.render();
}
window.vduDone = true;
</script>
</body>
</html>
