<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ARM BBC BASIC V</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: #000; --fg: #ccc; --bar: #202020; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px system-ui, sans-serif; overflow: hidden; }
  #wrap { position: absolute; inset: 0 0 28px 0; display: flex; align-items: center; justify-content: center; }
  canvas#screen { image-rendering: pixelated; image-rendering: crisp-edges; background: #000; outline: none; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 28px; background: var(--bar); display: flex; gap: 8px; align-items: center; padding: 0 8px; }
  #bar select, #bar button, #bar label { font: inherit; color: #ddd; background: #333; border: 1px solid #555; border-radius: 3px; padding: 2px 6px; }
  #bar .spacer { flex: 1; }
  #drop { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,80,.5); color: #fff; font-size: 24px; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="screen" tabindex="0"></canvas></div>
<div id="bar">
  <select id="examples" title="Example programs"><option value="">Examples…</option></select>
  <button id="esc" title="Escape (stop program)">Escape</button>
  <button id="reset" title="Restart BASIC">Reset</button>
  <label title="Load a BASIC file (text or tokenised)">Load file <input id="file" type="file" hidden></label>
  <span class="spacer"></span>
  <span id="status"></span>
</div>
<div id="drop">Drop a BASIC program to load it</div>
<script type="module" src="./demo.js"></script>
</body>
</html>
