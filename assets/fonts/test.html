<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>RISC OS Fonts</title>
<link rel="stylesheet" href="fonts.css">
<style>
body { background:#ddd; color:#000; margin:16px; font: 13px system-ui, sans-serif; }
.row { background:#fff; margin:4px 0; padding:4px 8px; display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; }
.lbl { width:200px; font:11px monospace; color:#555; }
.wimp { background:#ddd; padding:8px; }
.title { background:#ffffcc; border:2px solid #000; padding:2px 8px; display:inline-block; font:12pt "Homerton", Helvetica, sans-serif; }
canvas { image-rendering: pixelated; background:#fff; }
</style></head><body>
<h3>Desktop font (Homerton.Medium 12pt) and families</h3>
<div class="wimp"><span class="title">Filer: ADFS::HardDisc4.$.Apps</span>
<span style="font:12pt Homerton">!Draw  !Edit  !Paint  Apps  Task manager  Quit</span></div>
<div id="rows"></div>
<h3>System font (8x8, from kernel)</h3>
<canvas id="sys" width="512" height="512"></canvas>
<script type="module">
const fonts = (await (await fetch('fonts.json')).json()).fonts;
const sample = 'The quick brown fox jumps over the lazy dog 0123456789 £$&@ ÀÉîõü ‘’“”–—…™ fi fl';
const rows = document.getElementById('rows');
for (const [name, f] of Object.entries(fonts)) {
  const r = document.createElement('div'); r.className = 'row';
  r.innerHTML = `<span class="lbl">${name}</span>`;
  for (const sz of [16, 32]) {
    const s = document.createElement('span');
    s.style.font = `${f.style} ${f.weight} ${sz}px "${f.family}", cursive`;
    s.textContent = name.startsWith('S') && (name === 'Selwyn' || name === 'Sidney') ? String.fromCharCode(...Array.from({length:60},(_, i)=>65+i)) : sample;
    r.append(s);
  }
  rows.append(r);
}
const sys = await (await fetch('system8x8.json')).json();
const cv = document.getElementById('sys'), g = cv.getContext('2d');
g.fillStyle = '#000';
for (let c = 0; c < 256; c++) for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++)
  if (sys.chars[c][y] & (0x80 >> x)) g.fillRect(((c & 15) * 8 + x) * 4, ((c >> 4) * 8 + y) * 4, 4, 4);
await document.fonts.ready;
document.body.dataset.ready = 1;
</script></body></html>
