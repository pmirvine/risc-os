<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RISC OS Sprite Pools</title>
<style>
  :root { --bg: #dddddd; --fg: #000; --card: #fff; --check1: #cfc; --check2: #9c9; }
  body { margin: 0; padding: 12px 16px; font: 12px/1.3 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  h1 { font-size: 18px; margin: 0 0 8px; }
  h2 { font-size: 15px; margin: 18px 0 6px; border-bottom: 1px solid #888; }
  h3 { font-size: 12px; margin: 10px 0 4px; color: #333; font-weight: 600; }
  .bar { position: sticky; top: 0; background: var(--bg); padding: 6px 0; z-index: 1; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .s { background: var(--card); border: 1px solid #aaa; padding: 4px; display: flex; flex-direction: column; align-items: center; min-width: 60px; max-width: 100%; }
  .s .img { background: repeating-conic-gradient(var(--check1) 0 25%, var(--check2) 0 50%) 0 0 / 8px 8px; line-height: 0; max-width: 100%; overflow: hidden; }
  .s img { image-rendering: pixelated; display: block; }
  .s .n { margin-top: 3px; font-family: ui-monospace, monospace; font-size: 11px; word-break: break-all; text-align: center; }
  .s .d { color: #666; font-size: 10px; }
</style>
</head>
<body>
<h1>RISC OS 3.71 sprite pools</h1>
<div class="bar">
  <label>Pool <select id="pool"><option value="">(all)</option></select></label>
  <label>Zoom <select id="zoom"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label>
  <label>Filter <input id="filter" placeholder="sprite name"></label>
  <span>Sprites drawn at 1 px = 2 OS units &times; zoom (rectangular-pixel sprites scaled by their eig). Checkerboard = masked.</span>
</div>
<div id="out"></div>
<script type="module">
const index = await (await fetch('index.json')).json();
const pools = Object.keys(index).sort((a, b) => a.localeCompare(b));
const sel = document.getElementById('pool');
for (const p of pools) sel.append(new Option(p, p));
const params = new URLSearchParams(location.search);
if (params.get('pool')) sel.value = params.get('pool');
if (params.get('filter')) document.getElementById('filter').value = params.get('filter');
const onlyFile = params.get('file');
if (params.get('zoom')) document.getElementById('zoom').value = params.get('zoom');
const cache = {};
async function manifest(pool, file) {
  const k = pool + '/' + file;
  return cache[k] ||= (await fetch(`${encodeURIComponent(pool)}/${encodeURIComponent(file)}.json`)).json();
}
async function render() {
  const out = document.getElementById('out');
  out.textContent = '';
  const zoom = +document.getElementById('zoom').value;
  const filter = document.getElementById('filter').value.toLowerCase();
  for (const pool of sel.value ? [sel.value] : pools) {
    const h2 = document.createElement('h2'); h2.textContent = pool; out.append(h2);
    for (const [file, info] of Object.entries(index[pool])) {
      if (onlyFile && file !== onlyFile) continue;
      const m = await manifest(pool, file);
      const h3 = document.createElement('h3'); h3.textContent = `${file}  (${info.source})`; out.append(h3);
      const grid = document.createElement('div'); grid.className = 'grid'; out.append(grid);
      for (const [name, s] of Object.entries(m)) {
        if (filter && !name.includes(filter)) continue;
        const d = document.createElement('div'); d.className = 's';
        const im = new Image();
        im.src = `${encodeURIComponent(pool)}/${s.file.split('/').map(encodeURIComponent).join('/')}`;
        im.width = (s.osW / 2) * zoom; im.height = (s.osH / 2) * zoom;
        im.title = JSON.stringify(s);
        const box = document.createElement('div'); box.className = 'img'; box.append(im);
        const n = document.createElement('div'); n.className = 'n';
        n.textContent = [...name].map((c) => c.charCodeAt(0) > 126 ? `\\x${c.charCodeAt(0).toString(16)}` : c).join('');
        const dd = document.createElement('div'); dd.className = 'd'; dd.textContent = `${s.w}x${s.h} ${s.bpp}bpp e${s.xeig}${s.yeig}`;
        d.append(box, n, dd); grid.append(d);
      }
    }
  }
  document.body.dataset.ready = '1';
}
for (const id of ['pool', 'zoom']) document.getElementById(id).onchange = render;
document.getElementById('filter').oninput = render;
render();
</script>
</body>
</html>
